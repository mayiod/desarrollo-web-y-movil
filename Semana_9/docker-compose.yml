version: '3.8'

services:
  vault-dev:
    image: hashicorp/vault
    container_name: vault-dev
    ports:
    - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=dev-only-token

  auth-service:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8100:8100"
    command: uvicorn auth_service:app --host 0.0.0.0 --port 8100

  api-gateway:
      build: 
        context: .
        dockerfile: Dockerfile
      container_name: api-gateway
      ports:
        - "8000:8000"
      environment:
        - VAULT_ADDR=http://vault-dev:8200
        - VAULT_TOKEN=dev-only-token
        - BACKEND_URL=http://backend-api:9000
        - AUTH_URL=http://auth-service:8100
      depends_on:
        - vault-dev
        - auth-service
      command: uvicorn gateway:app --host 0.0.0.0 --port 8000
      
  backend-api:
      build: 
        context: .
        dockerfile: Dockerfile
      container_name: backend-api
      ports:
        - "9000:9000"
      environment:
        - VAULT_ADDR=http://vault-dev:8200
        - VAULT_TOKEN=dev-only-token
        - INTERNAL_GATEWAY_SECRET=gateway-api-secret-456
      depends_on:
        - vault-dev
      command: uvicorn backend_api:app --host 0.0.0.0 --port 9000