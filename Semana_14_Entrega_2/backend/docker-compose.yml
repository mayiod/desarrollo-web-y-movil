services:
  vault-dev:
    image: hashicorp/vault
    container_name: vault-dev
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-only-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200

  # Carga los secretos en Vault al arrancar y termina
  vault-init:
    image: hashicorp/vault
    container_name: vault-init
    depends_on:
      - vault-dev
    environment:
      VAULT_ADDR: http://vault-dev:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-dev-only-token}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until vault status > /dev/null 2>&1; do sleep 1; done
        vault kv put secret/gateway \
          backend_shared_secret="${BACKEND_SHARED_SECRET:-gateway-api-secret-456}" \
          auth_introspection_secret="${AUTH_INTROSPECTION_SECRET:-gateway-auth-secret-789}"
    restart: "no"

  auth-service:
    build: .
    container_name: auth-service
    ports:
      - "8100:8100"
    environment:
      AUTH_INTROSPECTION_SECRET: ${AUTH_INTROSPECTION_SECRET:-gateway-auth-secret-789}
    command: uvicorn auth_service:app --host 0.0.0.0 --port 8100

  backend-api:
    build: .
    container_name: backend-api
    ports:
      - "9000:9000"
    environment:
      INTERNAL_GATEWAY_SECRET: ${BACKEND_SHARED_SECRET:-gateway-api-secret-456}
      DB_PATH: /data/frio_natural.db
    volumes:
      - backend-data:/data
    command: uvicorn backend_api:app --host 0.0.0.0 --port 9000

  api-gateway:
    build: .
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      VAULT_ADDR: http://vault-dev:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-dev-only-token}
      BACKEND_URL: http://backend-api:9000
      AUTH_URL: http://auth-service:8100
    depends_on:
      vault-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
      backend-api:
        condition: service_started
    command: uvicorn gateway:app --host 0.0.0.0 --port 8000

  graphql-service:
      build: .
      container_name: graphql-service
      command: uvicorn graphql_service:app --host 0.0.0.0 --port 8050
      environment:
        - BACKEND_URL=http://backend-api:9000
        - INTERNAL_GATEWAY_SECRET=${INTERNAL_GATEWAY_SECRET:-super-secret-backend}
      networks:
        - default
      depends_on:
        - backend-api
        
  analytics-service:
      build: .
      container_name: analytics-service
      command: python analytics_service.py
      networks:
        - default
        
volumes:
  backend-data:
