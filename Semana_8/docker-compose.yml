version: '3.8'

services:
  vault-dev:
    image: hashicorp/vault:latest
    container_name: vault-dev
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=dev-only-token

  backend:
    build: .
    container_name: backend-api
    ports:
      - "9000:9000"
    environment:
      - INTERNAL_GATEWAY_SECRET=gateway-api-secret-456
    command: uvicorn backend_api:app --host 0.0.0.0 --port 9000
    depends_on:
      - vault-dev

  gateway:
    build: .
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      - VAULT_ADDR=http://vault-dev:8200
      - VAULT_TOKEN=dev-only-token
      - BACKEND_URL=http://backend:9000
    command: uvicorn gateway:app --host 0.0.0.0 --port 8000
    depends_on:
      - backend
      - vault-dev