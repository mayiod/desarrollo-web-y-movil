<!DOCTYPE html>
<html lang="es">
    <head>
        <title> Prueba Grid System - Christian Ayo </title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

    <body>
  
        <div class="container-fluid mt-3 text-center text-white fw-bold">
            
            <div class="row p-3">
                <h1 class="bg-success col-12 p-3"> Barra de Navegación </h1>
            </div>

            <div class="row p-3">
                <h2 class="bg-primary col-6 p-3"> Seccion 1 </h2>
                <h2 class="bg-secondary col-6 p-3"> Seccion 2 </h2>
            </div>

            <div class="row p-3">
                <h3 class="bg-danger col-5 p-3"> Seccion 3 </h3>
                <h2 class="bg-info col-2 p-3"> <a href="https://canvas.unab.cl/"> Seccion 4 </a> </h2>
                <h3 class="bg-primary col-5 p-3"> Seccion 5 </h3>
            </div>

            <div class="row p-3">
                <h4 class="bg-warning col-4 p-3"> Seccion 6 </h4>
                <h3 class="bg-dark col-4 p-3"> Seccion 7 </h3>
                <h4 class="bg-danger col-4 p-3"> Seccion 8 </h4>
            </div>
            
            <div class="row p-3">
                <h5 class="bg-success col-4 p-3"> Seccion 9 </h5>
                <h5 class="bg-primary col-2 p-3"> Seccion 10 </h5>
                <h5 class="bg-warning col-2 p-3"> Seccion 11 </h5>
                <h5 class="bg-secondary col-4 p-3"> Seccion 12 </h5>
            </div>                   
            
        </div>

    </body>
</html>
