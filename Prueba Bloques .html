<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practica Semana 1 - Grid System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container-fluid text-center text-white fw-bold">
    <!-- Header / Navbar: 12 columnas -->
    <div class="row p-3 bg-primary">
      <div class="col-12">Navbar (col-12)</div>
    </div>

    <!-- Seccion 3 - 6 - 3 -->
    <div class="row p-3">
      <div class="col-3 bg-secondary p-3">Izquierda (col-3)</div>
      <div class="col-6 bg-dark p-3">Centro (col-6)</div>
      <div class="col-3 bg-primary p-3">Derecha (col-3)</div>
    </div>

    <!-- Seccion 4 - 4 - 4 -->
    <div class="row p-3">
      <div class="col-4 bg-warning text-dark p-3">Bloque 1 (col-4)</div>
      <div class="col-4 bg-danger p-3">Bloque 2 (col-4)</div>
      <div class="col-4 bg-success p-3">Bloque 3 (col-4)</div>
    </div>
  </div>
</body>
</html>
